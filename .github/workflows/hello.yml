name: Learn GitHub Actions

on:
  push:

jobs:
  hello:
    runs-on: ubuntu-latest

    steps:
      - name: Print Date
        run: date

      - name: Show Current Directory
        run: pwd

      - name: Show Node Version
        run: node -v
